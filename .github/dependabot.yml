# Dependabot opens a pull request when a dependency publishes a new version.
# The Docker workflow tests every pull request, so each bump arrives tested.
version: 2
updates:
  # Rust server crates. FlashRaw (the RAW decoder) is young and moves fast, so it
  # gets its own pull request the day a release lands; every other crate is
  # grouped into one pull request so they do not pile up.
  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: daily
    groups:
      other-crates:
        patterns: ["*"]
        exclude-patterns: ["flashraw"]
    labels: [dependencies]

  # Actions used by the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
