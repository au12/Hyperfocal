# When FlashRaw publishes a new release, Dependabot opens one pull request that
# moves all of its crates (flashraw, flashraw-core, flashraw-formats) together.
# CI tests it like any pull request; merge it to ship the new decoder.
# Nothing else is watched.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: daily
    allow:
      - dependency-name: "flashraw*"
    groups:
      flashraw:
        patterns: ["flashraw*"]
