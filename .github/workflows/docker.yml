name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Weekly rebuild, so security fixes in Debian's packages (libheif, LibRaw, the base
  # image) reach the published image without a code change.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install exiftool, nasm, libheif and LibRaw
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl nasm pkg-config libclang-dev \
            libheif-dev libheif-plugin-libde265 libraw-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Server tests
        working-directory: server
        run: cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Web type check and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

  # A generated 300,000-photo index through the real router: catches a query that turns
  # into a full scan before it reaches a real archive. Runs alongside the tests; timing
  # on shared runners is noisy, so it does not hold back the image.
  large-library:
    name: Large library (300,000 photos)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Install exiftool, nasm, libheif and LibRaw
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libimage-exiftool-perl nasm pkg-config libclang-dev \
            libheif-dev libheif-plugin-libde265 libraw-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: release
      - name: 300,000-photo library
        working-directory: server
        run: cargo test --release --locked --test large_library -- --ignored --nocapture

  ml-test:
    name: ML service tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ml/requirements.txt
      - name: Unit tests (the model tests run inside the image build)
        working-directory: ml
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q tests

  image:
    name: Build and publish image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hyperfocal
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable=${{ github.event_name != 'schedule' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Always start from the newest base images. The weekly run also skips the
          # layer cache, so apt installs the current Debian packages.
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # The companion container for People & pets: CPU (latest) and NVIDIA (cuda) variants.
  # The build downloads the models (checked against their sha256) and loads every one of
  # them once, so a broken model fails here, not on your server.
  ml-image:
    name: Build and publish ML image (${{ matrix.variant }})
    needs: ml-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space (the CUDA libraries are large)
        if: matrix.variant == 'cuda'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hyperfocal-ml
          flavor: |
            latest=false
            suffix=${{ matrix.variant == 'cuda' && '-cuda' || '' }},onlatest=true
          tags: |
            type=raw,value=latest,enable=${{ matrix.variant == 'cpu' && '{{is_default_branch}}' || 'false' }}
            type=raw,value=cuda,suffix=,enable=${{ matrix.variant == 'cuda' && '{{is_default_branch}}' || 'false' }}
            type=sha,format=short,enable=${{ github.event_name != 'schedule' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ml/Dockerfile
          build-args: VARIANT=${{ matrix.variant }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha,scope=ml-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=ml-${{ matrix.variant }}
