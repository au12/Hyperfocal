name: Docker

# Fast checks on every push and pull request; the heavy work only where it is needed.
#
#   pull request   tests for the parts that changed. The image is built (not pushed) only
#                  when its Dockerfile changes.
#   push to main   the same tests, then publishes :latest when the image's inputs changed.
#                  A push that touches only docs builds nothing.
#   tag vX.Y.Z     a release: everything, plus the major tests (300,000-photo library,
#                  and fuzzing in fuzz.yml). The versioned images wait for them.
#   weekly         rebuilds the image from scratch, so security fixes in Debian's
#                  packages (libheif, LibRaw, the base image) reach them without a code change.
#   manual         everything; the major tests too unless switched off.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      major:
        description: Run the major tests (300,000-photo library) as well
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # What this run has to do: which parts changed, and whether it is a release.
  changes:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      major: ${{ steps.mode.outputs.major }}
      server: ${{ steps.mode.outputs.all == 'true' || steps.filter.outputs.server == 'true' }}
      web: ${{ steps.mode.outputs.all == 'true' || steps.filter.outputs.web == 'true' }}
      image: ${{ steps.plan.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: mode
        env:
          EVENT: ${{ github.event_name }}
          MAJOR_INPUT: ${{ inputs.major }}
        run: |
          major=false; all=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then major=true; all=true; fi
          if [[ "$EVENT" == schedule ]]; then all=true; fi
          if [[ "$EVENT" == workflow_dispatch ]]; then all=true; [[ "$MAJOR_INPUT" == true ]] && major=true; fi
          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "all=$all" >> "$GITHUB_OUTPUT"
          echo "major=$major all=$all"
      - id: filter
        if: steps.mode.outputs.all != 'true'
        uses: dorny/paths-filter@v4
        with:
          # A change to CI itself counts as a change to everything it checks.
          filters: |
            ci: &ci
              - .github/workflows/docker.yml
              - .github/actions/**
            server:
              - *ci
              - server/**
              - ml/**
            web:
              - *ci
              - web/**
            image:
              - *ci
              - server/**
              - web/**
              - ml/**
              - docker/**
              - Dockerfile
              - .dockerignore
            image_def:
              - *ci
              - docker/**
              - Dockerfile
              - .dockerignore
      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          ALL: ${{ steps.mode.outputs.all }}
          IMAGE: ${{ steps.filter.outputs.image }}
          IMAGE_DEF: ${{ steps.filter.outputs.image_def }}
        run: |
          image=false
          if [[ "$ALL" == true ]]; then
            image=true
          elif [[ "$EVENT" == pull_request ]]; then
            # Only check that the image still builds when its definition changed.
            [[ "$IMAGE_DEF" == true ]] && image=true
          else
            [[ "$IMAGE" == true ]] && image=true
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "image=$image"

  server:
    name: Server tests
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          # Pull requests read main's cache but don't add their own: the 10 GB cache
          # limit is shared, and a branch's cache is no use to main.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # ONNX Runtime for the AI engine's tests (the eye models are in the repository; the
      # large models are not downloaded here). The same wheel as the image's.
      - name: ONNX Runtime
        run: |
          url=$(sed -n 's/^ARG ORT_WHEEL_AMD64=//p' Dockerfile)
          sum=$(sed -n 's/^ARG ORT_SHA256_AMD64=//p' Dockerfile)
          curl -fsSL --retry 5 -o /tmp/ort.whl "$url"
          echo "$sum  /tmp/ort.whl" | sha256sum -c -
          unzip -j -o /tmp/ort.whl onnxruntime/capi/libonnxruntime.so.1.29.0 -d "$RUNNER_TEMP/ort"
          echo "HYPERFOCAL_ORT_LIB=$RUNNER_TEMP/ort/libonnxruntime.so.1.29.0" >> "$GITHUB_ENV"
      - name: Server tests
        working-directory: server
        run: cargo test --locked

  web:
    name: Web check and build
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Type check and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run check
          npm run build

  # Major test, releases only: a generated 300,000-photo index through the real router.
  # Catches a query that turns into a full scan before it reaches a real archive.
  large-library:
    name: Large library (300,000 photos)
    needs: changes
    if: needs.changes.outputs.major == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/native-deps
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
          key: release
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: 300,000-photo library
        working-directory: server
        run: cargo test --release --locked --test large_library -- --ignored --nocapture

  image:
    name: Build and publish image
    needs: [changes, server, web, large-library]
    # Skipped test jobs are fine (nothing changed there); failed ones are not.
    if: >-
      always() && needs.changes.result == 'success' && needs.changes.outputs.image == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      CACHE_REF: ghcr.io/${{ github.repository_owner }}/hyperfocal:buildcache
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/hyperfocal
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short,enable=${{ github.event_name != 'schedule' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=ref,event=pr
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Always start from the newest base images. The weekly run also skips the
          # layer cache, so apt installs the current Debian packages.
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          # The layer cache lives in GHCR, not the Actions cache: exporting it there took
          # over 3 minutes a build, and its gigabytes pushed the Rust cache out of the
          # 10 GB limit. Layers the image already pushed are not uploaded twice.
          cache-from: type=registry,ref=${{ env.CACHE_REF }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0},mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true', env.CACHE_REF) || '' }}
