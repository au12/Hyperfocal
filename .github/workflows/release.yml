name: Release

# A release is a version bump pushed to main (scripts/release.sh X.Y.Z). This workflow
# then tags that commit vX.Y.Z, publishes the GitHub release (its notes are
# docs/releases/vX.Y.Z.md, or the commits since the last release), and starts the
# release runs of Docker (every test, the 300,000-photo library test, then the versioned
# images) and Fuzz on the tag. Pushing a vX.Y.Z tag by hand still works as before.
#
# Why the tag is made here: Claude Code's cloud sessions push through a GitHub proxy that
# only accepts branch updates, so they can push the version bump but not a tag. A tag
# made with this workflow's own token starts no other workflow (GitHub's rule against
# loops), which is why Docker and Fuzz are started on it explicitly.
#
# Run it by hand to start Docker and Fuzz on the current version's tag again.

on:
  push:
    branches: [main]
    paths: [server/Cargo.toml]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Tag and publish the release
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the release
      actions: write # start Docker and Fuzz on the tag
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the previous release's tag, for the notes

      - id: version
        name: Version
        run: |
          v=$(sed -n 's/^version = "\(.*\)"$/\1/p' server/Cargo.toml | head -n1)
          if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=server/Cargo.toml::Not an X.Y.Z version: '$v'"
            exit 1
          fi
          web=$(jq -r .version web/package.json)
          if [[ "$web" != "$v" ]]; then
            echo "::error file=web/package.json::Version $web, but server/Cargo.toml says $v (scripts/release.sh bumps both)"
            exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$v" > /dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "v$v is already released."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "Releasing v$v"
          fi

      - name: Release notes
        if: steps.version.outputs.new == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2> /dev/null || true)
          if [[ -f "docs/releases/$TAG.md" ]]; then
            cp "docs/releases/$TAG.md" notes.md
          else
            image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/hyperfocal"
            {
              echo "## Changes"
              echo
              git log --no-merges --format='- %s' ${prev:+"$prev"..}HEAD
              echo
              echo "## Install"
              echo
              echo "The image is \`$image:$VERSION\` (linux/amd64), published once this release's checks pass."
            } > notes.md
          fi
          if [[ -n "$prev" ]]; then
            printf '\n**Full changelog:** %s/%s/compare/%s...%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$prev" "$TAG" >> notes.md
          fi
          cat notes.md

      - name: Tag and publish
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "Hyperfocal $VERSION" --notes-file notes.md

      - name: Start Docker and Fuzz on the tag
        if: steps.version.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh workflow run docker.yml --ref "$TAG"
          gh workflow run fuzz.yml --ref "$TAG"
          echo "Started Docker and Fuzz on $TAG."
