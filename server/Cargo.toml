[package]
name = "hyperfocal"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fast self-hosted RAW photo culling and library manager"
publish = false

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
flashraw = { version = "=0.3.1", default-features = false, features = ["mmap", "rayon", "simd"] }
fast_image_resize = "5"
half = "2"
kamadak-exif = "0.6"
parking_lot = "0.12"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
quick-xml = "0.37"
r2d2 = "0.8"
r2d2_sqlite = "0.31"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turbojpeg = { version = "1", features = ["cmake"] }
libc = "0.2"
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
strip = true

[profile.dev.package."*"]
opt-level = 2
