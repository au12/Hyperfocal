[package]
name = "hyperfocal"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Fast self-hosted RAW photo culling and library manager"
publish = false

[features]
default = ["heic", "libraw"]
# HEIC/HEIF (phones, Canon/Sony .HIF) through the system libheif and its libde265 plugin.
heic = ["dep:libheif-rs"]
# LibRaw as the fallback RAW decoder, through the system libraw_r (thread-safe build).
libraw = ["dep:bindgen", "dep:pkg-config"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
flashraw = { version = "0.3.1", default-features = false, features = ["mmap", "rayon", "simd"] }
# FlashRaw's own parsers, for maker-note facts it reads but does not apply (Canon white level).
flashraw-core = { version = "0.3.1", default-features = false }
flashraw-formats = { version = "0.3.1", default-features = false }
fast_image_resize = "5"
half = "2"
kamadak-exif = "0.6"
parking_lot = "0.12"
png = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "tiff"] }
quick-xml = "0.37"
r2d2 = "0.8"
r2d2_sqlite = "0.31"
rayon = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
turbojpeg = { version = "1", features = ["cmake"] }
# mozjpeg's trellis quantization in pure Rust: smaller thumbnails and previews made in the
# background (see images::jpeg::encode_small).
mozjpeg-rs = { version = "0.9", default-features = false }
libc = "0.2"
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
rand = "0.9"
base64 = "0.22"
libheif-rs = { version = "3", default-features = false, features = ["v1_17"], optional = true }
# Archive integrity: content hashes of the originals, and alerts to ntfy, Gotify or a webhook.
xxhash-rust = { version = "0.8", features = ["xxh3"] }
# Checksums of the records in the thumbnail packs.
crc32fast = "1"
ureq = { version = "3.5", default-features = false, features = ["rustls"] }

[build-dependencies]
bindgen = { version = "0.73", default-features = false, features = ["runtime"], optional = true }
pkg-config = { version = "0.3", optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
debug = false
strip = true

[profile.dev.package."*"]
opt-level = 2

[lints.rust]
# cargo-fuzz builds with --cfg fuzzing (see src/fuzzing.rs and fuzz/).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
